<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #2d2d2d;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 50px;
        }
        .form-container {
            background-color: #333;
            padding: 20px;
            border-radius: 8px;
        }
        .todo-list-container {
            margin-top: 30px;
        }
        .todo-item {
            background-color: #444;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .todo-header {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        .todo-category {
            font-style: italic;
            color: #aaa;
        }
        .status-btn {
            margin-right: 10px;
        }
        .status-to-be-done {
            background-color: #ff9800;
            border-color: #ff9800;
        }
        .status-in-progress {
            background-color: #2196f3;
            border-color: #2196f3;
        }
        .status-done {
            background-color: #4caf50;
            border-color: #4caf50;
        }
        .status-canceled {
            background-color: #f44336;
            border-color: #f44336;
        }
        .todo-actions button {
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Todo Form -->
        <div class="form-container">
            <h3 class="text-center">Add New Todo</h3>
            <form id="todoForm">
                <div class="mb-3">
                    <label for="todoName" class="form-label">Todo Name</label>
                    <input type="text" class="form-control" id="todoName" required>
                </div>
                <div class="mb-3">
                    <label for="todoDescription" class="form-label">Todo Description (Optional)</label>
                    <textarea class="form-control" id="todoDescription"></textarea>
                </div>
                <div class="mb-3">
                    <label for="todoDeadline" class="form-label">Deadline (Optional)</label>
                    <input type="date" class="form-control" id="todoDeadline">
                </div>
                <div class="mb-3">
                    <label for="todoStatus" class="form-label">Status</label>
                    <select class="form-control" id="todoStatus">
                        <option value="to-be-done">To Be Done</option>
                        <option value="in-progress">In Progress</option>
                        <option value="done">Done</option>
                        <option value="canceled">Canceled</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="todoCategory" class="form-label">Category (Optional)</label>
                    <input type="text" class="form-control" id="todoCategory" placeholder="Default category">
                </div>
                <button type="submit" class="btn btn-primary w-100">Add Todo</button>
            </form>
        </div>

        <!-- Todo List -->
        <div class="todo-list-container">
            <h3 class="text-center">Todo List</h3>

            <!-- Hard-coded Todo Entries -->
            <div id="todoList">
                <!-- Example Todo 1 -->
                <div class="todo-item">
                    <h5 class="todo-header">Sample Todo 1</h5>
                    <p>Description: <span>Sample description here</span></p>
                    <p>Created on: <span>2025-02-25</span></p>
                    <p>Deadline: <span>2025-03-01</span></p>
                    <p class="todo-category">Category: <span>Work</span></p>
                    <div class="todo-actions">
                        <button class="btn btn-sm status-btn status-to-be-done">To Be Done</button>
                        <button class="btn btn-sm btn-outline-success">Mark as Completed</button>
                    </div>
                </div>

                <!-- Example Todo 2 -->
                <div class="todo-item">
                    <h5 class="todo-header">Sample Todo 2</h5>
                    <p>Description: <span>Another sample description</span></p>
                    <p>Created on: <span>2025-02-20</span></p>
                    <p>Deadline: <span>2025-03-05</span></p>
                    <p class="todo-category">Category: <span>Personal</span></p>
                    <div class="todo-actions">
                        <button class="btn btn-sm status-btn status-in-progress">In Progress</button>
                        <button class="btn btn-sm btn-outline-success">Mark as Completed</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS & Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    <script>
        // Example of adding functionality for form submission
        document.getElementById("todoForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const todoName = document.getElementById("todoName").value;
            const todoDescription = document.getElementById("todoDescription").value;
            const todoDeadline = document.getElementById("todoDeadline").value;
            const todoStatus = document.getElementById("todoStatus").value;
            const todoCategory = document.getElementById("todoCategory").value || "Default";

            // Add a new todo to the list (this is just a simple demo)
            const todoList = document.getElementById("todoList");
            const newTodo = document.createElement("div");
            newTodo.classList.add("todo-item");
            newTodo.innerHTML = `
                <h5 class="todo-header">${todoName}</h5>
                <p>Description: <span>${todoDescription || "No description"}</span></p>
                <p>Created on: <span>${new Date().toLocaleDateString()}</span></p>
                <p>Deadline: <span>${todoDeadline || "No deadline"}</span></p>
                <p class="todo-category">Category: <span>${todoCategory}</span></p>
                <div class="todo-actions">
                    <button class="btn btn-sm status-btn status-${todoStatus.replace(" ", "-")}">${todoStatus.replace(" ", "-").toUpperCase()}</button>
                    <button class="btn btn-sm btn-outline-success">Mark as Completed</button>
                </div>
            `;
            todoList.appendChild(newTodo);

            // Reset the form
            document.getElementById("todoForm").reset();
        });
    </script>
</body>
</html>
